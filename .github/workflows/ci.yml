name: CI

on:
  push:
    branches: [main, maliaka]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: node --check src/index.js
      - name: Test suite
        run: node --test tests/*.test.mjs
